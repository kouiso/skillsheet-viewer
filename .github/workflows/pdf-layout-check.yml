name: PDF Layout Check

# PDF のレイアウトは本文の長さで崩れる。本文は DB 側で変わるので、コードが無変更でも
# ある日突然崩れる。毎朝実データを引いて崩れを見張る。
# 検査の本体（本文を公開ログへ出さない仕組みを含む）は real-data-check.yml に共通化してある。
# 失敗の通知は ci-failure-notify.yml が workflow_run で拾う（この workflow 名で登録済み）。
on:
  schedule:
    # JST 06:00。朝いちで気づけるようにする。
    - cron: '0 21 * * *'
  workflow_dispatch:

# 読むだけの job なので token の権限も読み取りに絞る。
permissions:
  contents: read

jobs:
  pdf-layout-check:
    name: PDF layout check (real data)
    uses: ./.github/workflows/real-data-check.yml
    with:
      name: pdf
      sheet-id: ${{ vars.PDF_CHECK_SHEET_ID }}
      raster-deps: true
    secrets:
      database-url: ${{ secrets.PDF_CHECK_DATABASE_URL }}
      owner-id: ${{ secrets.SKILLSHEET_OWNER_ID }}
