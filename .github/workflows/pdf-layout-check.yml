name: PDF Layout Check

# PDF のレイアウトは本文の長さで崩れる。本文は DB 側で変わるので、コードが無変更でも
# ある日突然崩れる。PR の CI は fixture しか見ないため原理的に捕まらない。
# ここだけが実データを引いて崩れを見張る経路。
# 失敗の通知は ci-failure-notify.yml が workflow_run で拾う（この workflow 名で登録済み）。
on:
  schedule:
    # JST 06:00。朝いちで気づけるようにする。
    - cron: '0 21 * * *'
  workflow_dispatch:

# 読むだけの job なので token の権限も読み取りに絞る。
permissions:
  contents: read

jobs:
  pdf-layout-check:
    name: PDF layout check (real data)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # 後続の pnpm install / tsx / vitest が実行する第三者コードへ
          # Git 認証情報を渡さない。この job は push しない。
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # ci.yml と同じ理由で mise.toml を読めないため、バージョンを手動で同期させる。
          node-version: '22.21.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install system dependencies for PDF rasterization
        # ci.yml の test ジョブと同じ依存。ラスタ検査が PDF ページをビットマップ化する。
        run: sudo apt-get update && sudo apt-get install -y poppler-utils ghostscript imagemagick

      - name: Validate target sheet
        env:
          PDF_CHECK_DATABASE_URL: ${{ secrets.PDF_CHECK_DATABASE_URL }}
          PDF_CHECK_SHEET_ID: ${{ vars.PDF_CHECK_SHEET_ID }}
        run: |
          if [[ -z "$PDF_CHECK_DATABASE_URL" ]]; then
            echo '::error::PDF_CHECK_DATABASE_URL must be configured.'
            exit 1
          fi
          if [[ ! "$PDF_CHECK_SHEET_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo '::error::PDF_CHECK_SHEET_ID must be configured with a sheet UUID.'
            exit 1
          fi

      - name: Dump blocks from database
        env:
          DATABASE_URL: ${{ secrets.PDF_CHECK_DATABASE_URL }}
          PDF_CHECK_SHEET_ID: ${{ vars.PDF_CHECK_SHEET_ID }}
        # 本文やDBエラーは非公開の一時ファイルに限定する。成果物へはアップロードしない。
        run: |
          umask 077
          status=0
          pnpm exec tsx scripts/dump-blocks.ts --out "$RUNNER_TEMP/blocks.json" --sheet-id "$PDF_CHECK_SHEET_ID" > "$RUNNER_TEMP/pdf-dump.log" 2>&1 || status=$?
          echo "Database dump finished (exit $status)."
          exit "$status"

      - name: PDF layout check against real data
        env:
          REAL_BLOCKS_JSON: ${{ runner.temp }}/blocks.json
        # assertion の失敗文には実経歴が含まれうるため、成功時も公開ログへ転送しない。
        run: |
          umask 077
          status=0
          pnpm exec vitest run --config vitest.config.pdf.ts > "$RUNNER_TEMP/pdf-layout.log" 2>&1 || status=$?
          echo "PDF content and raster checks finished (exit $status)."
          exit "$status"

      - name: Remove private data and logs
        if: always()
        run: rm -f "$RUNNER_TEMP/blocks.json" "$RUNNER_TEMP/pdf-dump.log" "$RUNNER_TEMP/pdf-layout.log"
