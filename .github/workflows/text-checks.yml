name: Text Checks

# issue・PR・コメント本文の書き方チェックと公開内容チェック（#615）。
# 判定は .github/scripts/text-checks.cjs、設定は .github/text-checks.config.json。
# 本文の自動編集・自動削除はしない。目印つきのコメントを1つだけ作り、直れば同じコメントを更新する。
# pull_request_target でも PR 側のコードは取り出さない（checkout は既定ブランチのまま）。
on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: text-checks-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.event.comment.id || 'body' }}
  cancel-in-progress: true

jobs:
  check:
    name: Check issue / PR text
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ !endsWith(github.actor, '[bot]') }}
    steps:
      - name: Checkout default branch (no PR code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/text-checks.cjs
            .github/text-checks.config.json
          sparse-checkout-cone-mode: false
      - name: Run checks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # 非公開の規則（禁止語・固有語）。リポにもログにも置かない。未設定なら空で、公開してよい形だけで判定する。
          TEXT_CHECKS_PRIVATE_RULES: ${{ secrets.TEXT_CHECKS_PRIVATE_RULES }}
        with:
          script: |
            const checks = require('./.github/scripts/text-checks.cjs');
            const config = require('./.github/text-checks.config.json');
            config.publicContent.rules = config.publicContent.rules.concat(checks.loadPrivateRules(process.env.TEXT_CHECKS_PRIVATE_RULES));
            const { owner, repo } = context.repo;
            const p = context.payload;

            let number, body, author, kind, source, labels = [], draft = false;
            if (p.comment) {
              number = (p.issue || p.pull_request).number;
              body = p.comment.body;
              author = p.comment.user.login;
              kind = 'comment';
              source = `comment-${p.comment.id}`;
            } else if (p.pull_request) {
              number = p.pull_request.number;
              body = p.pull_request.body;
              author = p.pull_request.user.login;
              kind = 'pull_request';
              source = 'body';
              draft = p.pull_request.draft;
            } else {
              number = p.issue.number;
              body = p.issue.body;
              author = p.issue.user.login;
              kind = 'issue';
              source = 'body';
              labels = (p.issue.labels || []).map((l) => l.name);
            }

            const existing = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100,
            });
            // 同じ目印のコメントがあれば更新、なければ「要確認」のときだけ新規に作る。
            async function upsert(key, text, ok) {
              const marker = `${config.marker}:${key}`;
              const found = existing.find((c) => (c.body || '').startsWith(marker + '\n'));
              if (found) {
                if (found.body !== text) await github.rest.issues.updateComment({ owner, repo, comment_id: found.id, body: text });
              } else if (!ok) {
                await github.rest.issues.createComment({ owner, repo, issue_number: number, body: text });
              }
            }

            const failures = [];

            const pub = checks.checkPublicContent(body, config);
            const pubKey = `public-${source}`;
            await upsert(pubKey, checks.formatReport('public', pub, config).replace(`${config.marker}:public`, `${config.marker}:${pubKey}`), pub.ok);
            if (!pub.ok) failures.push(`公開内容チェック: ${pub.findings.map((f) => f.id).join(', ')}`);

            if (kind !== 'comment' && !checks.shouldSkipFormat({ kind, author, labels, draft }, config)) {
              const fmt = kind === 'issue' ? checks.checkIssueFormat(body, config) : checks.checkPrFormat(body, config);
              await upsert('format', checks.formatReport('format', fmt, config), fmt.ok);
              if (!fmt.ok) failures.push(`書き方チェック: ${fmt.missing.map((m) => m.name).join(', ')}`);
            }

            if (failures.length > 0) core.setFailed(failures.join(' / '));
            else core.info('All text checks passed.');
