name: Real Data Check (main)

# merge 後の main で、実データ（DB の本番シート）を使って PDF / XLSX の崩れを検査する。
# PR では実データを使わない。PR のコードに実データを読ませると、公開ログに出る
# 「どのテストが落ちたか」で情報を持ち出せてしまい、ネットワークを切っても塞げないため。
# PR は ci.yml の架空データで見て、実データはレビューを通って main に入ったコードだけで見る。
# 実データで崩れていた場合は、直前に merge した変更か DB の本文の変化のどちらかなので、
# 失敗は ci-failure-notify.yml が Slack と Devin へ渡す（push の失敗として扱う）。
# 検査の本体は real-data-check.yml。そこで commit が main に含まれていることも確かめる。
# 本体は @main で呼ぶ。相対パスだと、手動実行で選んだブランチの写しが読まれ、そのブランチが
# main に含まれる確認を外したまま本番 DB の secret を受け取れてしまうため。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'doc/**'
  # 手動実行も main の commit にしか効かない（本体が main の祖先でない commit を止める）。
  workflow_dispatch:

# 読むだけの job なので token の権限も読み取りに絞る。
permissions:
  contents: read

# 続けて merge された時は、新しい commit の検査が古い commit の分も含むので、古い実行は止める。
# 手動実行は別の group にする。古い ref への手動実行が、main の先頭の push 検査を止めないように。
concurrency:
  group: real-data-main-check-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  pdf:
    name: PDF (real data)
    uses: kouiso/skillsheet-viewer/.github/workflows/real-data-check.yml@main
    with:
      name: PDF
      sheet-id: ${{ vars.PDF_CHECK_SHEET_ID }}
      raster-deps: true
    secrets:
      database-url: ${{ secrets.PDF_CHECK_DATABASE_URL }}
      owner-id: ${{ secrets.SKILLSHEET_OWNER_ID }}

  xlsx:
    name: XLSX (real data)
    uses: kouiso/skillsheet-viewer/.github/workflows/real-data-check.yml@main
    with:
      name: XLSX
      sheet-id: ${{ vars.XLSX_CHECK_SHEET_ID }}
      test-paths: src/lib/export/xlsx-format-check.node.test.tsx
    secrets:
      database-url: ${{ secrets.XLSX_CHECK_DATABASE_URL }}
      owner-id: ${{ secrets.SKILLSHEET_OWNER_ID }}
