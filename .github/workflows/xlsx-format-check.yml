name: XLSX Format Check

# xlsx の書式はテンプレ複写・結合・罫線で構成され、コード変更でも DB 本文変化でも
# 崩れうる。PR の CI は fixture しか見ないため原理的に捕まらない。
# ここだけが実データを引いて崩れを見張る経路（pdf-layout-check.yml の xlsx 版）。
# 失敗の通知は ci-failure-notify.yml が workflow_run で拾う（この workflow 名で登録済み）。
on:
  schedule:
    # JST 06:00。朝いちで気づけるようにする。
    - cron: '0 21 * * *'
  workflow_dispatch:

# 読むだけの job なので token の権限も読み取りに絞る。
permissions:
  contents: read

jobs:
  xlsx-format-check:
    name: XLSX format check (real data)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # 後続の pnpm install / tsx / vitest が実行する第三者コードへ
          # Git 認証情報を渡さない。この job は push しない。
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # ci.yml と同じ理由で mise.toml を読めないため、バージョンを手動で同期させる。
          node-version: '22.21.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dump blocks from database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # 書き出し先を RUNNER_TEMP に置く。実在の案件本文を含むので、
        # 成果物としてアップロードしない（このリポジトリは public）。
        run: pnpm exec tsx script/dump-block.ts --out "$RUNNER_TEMP/blocks.json"

      - name: XLSX format check against real data
        env:
          REAL_BLOCKS_JSON: ${{ runner.temp }}/blocks.json
        run: pnpm exec vitest run --config vitest.config.pdf.ts src/lib/export/xlsx-format-check.node.test.tsx
