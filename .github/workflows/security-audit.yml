name: Security Audit

on:
  pull_request:
    # ready_for_review を入れるのは、draft の間は走らせず、draft を外した時に走らせるため。
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "pnpm-lock.yaml"
  workflow_dispatch:

# 同一 workflow・同 ref の二重起動を潰す。main push は取り消さない
# （cancel されるとそのコミット範囲のスキャンが二度と走らないため）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    # draft の PR では走らせない（workflow_dispatch は対象外なので常に走る）。
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # version を明示せず pnpm/action-setup に読ませる。root package.json の
      # packageManager（pnpm@10.33.0）と食い違うと Multiple versions of pnpm
      # specified エラーで即死するため、固定値は置かない（security-scan.yml と同じ方針）。
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.21.1"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run security audit
        # lockfile 管理外の npx 取得をやめ、devDependency 版を実行する（release-age ゲートと整合）。
        run: pnpm exec audit-ci --config audit-ci.jsonc
