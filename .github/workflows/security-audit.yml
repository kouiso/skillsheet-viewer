name: Security Audit

on:
  pull_request:
    paths:
      - \"pnpm-lock.yaml\"
  workflow_dispatch:

jobs:
  audit:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # version を明示せず pnpm/action-setup に読ませる。root package.json の
      # packageManager（pnpm@10.33.0）と食い違うと Multiple versions of pnpm
      # specified エラーで即死するため、固定値は置かない（security-scan.yml と同じ方針）。
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run security audit
        run: npx audit-ci --config audit-ci.jsonc
