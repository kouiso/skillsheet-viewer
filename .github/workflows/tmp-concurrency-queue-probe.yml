name: Temporary concurrency queue probe

# ci-failure-notify.yml で使う concurrency.queue: max を GitHub が受け付けるかを確かめる使い捨て。確認後すぐ削除する。
on:
  push:
    branches: [feature/cool-carson-9nidmm]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: tmp-concurrency-queue-probe-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    steps:
      - run: echo "queue max accepted"
