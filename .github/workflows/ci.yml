name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 命名規約（英語・小文字・単数形・ケバブケース）。人が書いても AI が書いても
  # PR 時点で必ずここを通る。node のセットアップ不要なので独立ジョブにして即座に落とす。
  naming:
    name: Naming convention
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      # 供給網対策でタグではなく commit へ固定する（タグは上流で付け替えられる）。v4 の実体。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check file and directory naming
        run: ./script/check-naming.sh

  node:
    name: Node (${{ matrix.check-type }})
    runs-on: ubuntu-latest
    # e2e はヘッドレス + playwright の2段構成で単体テストが最大 3 分あるため 15 分だと
    # 途中で打ち切られ、失敗詳細と証跡（trace）が残らない。完了まで待てるよう脚だけ延長する。
    timeout-minutes: ${{ matrix.check-type == 'e2e' && 30 || 15 }}
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        check-type: [lint, typecheck, test, build, e2e]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # actions/setup-node の node-version-file は .nvmrc / .node-version /
          # package.json / .tool-versions(asdf形式) のみ対応で、mise.toml の
          # TOML 形式は解釈できない（1行目 "[tools]" をバージョン文字列として
          # 誤読し失敗する）。mise.toml のバージョンと手動で同期させる。
          node-version: '22.21.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install system dependencies for PDF rasterization
        if: matrix.check-type == 'test'
        # ghostscript / imagemagick: print-quality-raster.node.test.tsx が PDF ページを
        # ビットマップへ変換し、pdfjs のテキスト層に映らない図形（文字を伴わないチップの
        # 断片等）を検出するために使う（poppler-utils の pdftoppm は使わない設計）。
        run: sudo apt-get update && sudo apt-get install -y poppler-utils ghostscript imagemagick

      - name: Lint
        if: matrix.check-type == 'lint'
        run: pnpm run lint

      - name: Typecheck
        if: matrix.check-type == 'typecheck'
        run: pnpm run type-check

      - name: Test
        if: matrix.check-type == 'test'
        run: pnpm run test

      - name: Build
        if: matrix.check-type == 'build'
        run: pnpm run build

      - name: Migrate database
        if: matrix.check-type == 'e2e'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm run db:migrate

      - name: Install Playwright browsers
        if: matrix.check-type == 'e2e'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install PDF utilities for E2E
        if: matrix.check-type == 'e2e'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      # 編集者系テストは /builder のオーナーゲート（session.user.id === SKILLSHEET_OWNER_ID）
      # を通る必要がある。シークレットの E2E ユーザーと SKILLSHEET_OWNER_ID が食い違うと
      # /builder が /login へリダイレクトし、ボタン待ちのテストが全てタイムアウトまで
      # ハングする（実際に 2026-09-14 に e2e 全体が赤化した）。対処として、CI 実行ごとに
      # e2e 専用ユーザーを provision し、その user.id を SKILLSHEET_OWNER_ID として
      # GITHUB_ENV 経由で後続ステップに渡す。シークレットの値には依存しない。
      - name: Provision E2E owner
        if: matrix.check-type == 'e2e'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          E2E_EMAIL: e2e-owner@example.test
          E2E_PASSWORD: E2e-test-pass-99
        run: |
          OWNER_ID=$(pnpm exec tsx script/bootstrap-owner.ts --email="$E2E_EMAIL" --password="$E2E_PASSWORD" --name="E2E Owner" | tail -n 1 | tr -d '[:space:]')
          test -n "$OWNER_ID"
          {
            echo "SKILLSHEET_OWNER_ID=$OWNER_ID"
            echo "E2E_EMAIL=$E2E_EMAIL"
            echo "E2E_PASSWORD=$E2E_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Playwright E2E
        if: matrix.check-type == 'e2e'
        env:
          BETTER_AUTH_URL: http://127.0.0.1:3210
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          VIEWER_CODE: ${{ secrets.VIEWER_CODE }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          REVALIDATE_SECRET: ${{ vars.REVALIDATE_SECRET }}
        # playwright は起動時に test-results/ 全体を消去する。headless-e2e の証跡
        # （test-results/e2e）が先に書かれていると消されるため、playwright を先に流す。
        run: pnpm run test:e2e:playwright

      # Playwright が失敗しても headless E2E まで止めない（証跡 artifact を残すため）。
      - name: Headless browser E2E
        if: matrix.check-type == 'e2e' && always()
        env:
          BETTER_AUTH_URL: http://127.0.0.1:3210
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          VIEWER_CODE: ${{ secrets.VIEWER_CODE }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          REVALIDATE_SECRET: ${{ vars.REVALIDATE_SECRET }}
        run: pnpm run test:e2e

      - name: Upload E2E evidence
        if: matrix.check-type == 'e2e' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: headless-e2e-evidence
          path: |
            test-results/e2e/
            test-results/playwright/
          if-no-files-found: error
          retention-days: 14
