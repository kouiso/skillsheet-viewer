name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR が md / doc 配下だけの変更かを判定する。lint / typecheck / test / build は branch protection の
  # required check なので workflow ごと paths-ignore すると status が出ず PR が詰まる。
  # そのため required でない e2e の脚だけをこの結果で止める。
  changes:
    name: Detect docs-only change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          docs_only=false
          if [ "$EVENT_NAME" = pull_request ]; then
            files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)') || files=""
            # 取得に失敗した場合や変更ファイルが空の場合は docs-only 扱いにせず e2e を走らせる。
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '(\.md$|^doc/)'; then
              docs_only=true
            fi
          fi
          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"

  # 命名規約（英語・小文字・単数形・ケバブケース）。人が書いても AI が書いても
  # PR 時点で必ずここを通る。node のセットアップ不要なので独立ジョブにして即座に落とす。
  naming:
    name: Naming convention
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      # 供給網対策でタグではなく commit へ固定する（タグは上流で付け替えられる）。v4 の実体。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check file and directory naming
        run: bash .github/ci/run.sh naming

  node:
    name: Node (${{ matrix.check-type }})
    needs: changes
    runs-on: ubuntu-latest
    # e2e はヘッドレス + playwright の2段構成で単体テストが最大 3 分あるため 15 分だと
    # 途中で打ち切られ、失敗詳細と証跡（trace）が残らない。完了まで待てるよう脚だけ延長する。
    timeout-minutes: ${{ matrix.check-type == 'e2e' && 30 || 15 }}
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        check-type: [lint, typecheck, test, build, e2e]
    steps:
      # docs のみの PR の e2e 脚は、以降の e2e 手順を全部飛ばすので依存の準備も省く。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: ${{ !(matrix.check-type == 'e2e' && needs.changes.outputs.docs_only == 'true') }}

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        if: ${{ !(matrix.check-type == 'e2e' && needs.changes.outputs.docs_only == 'true') }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: ${{ !(matrix.check-type == 'e2e' && needs.changes.outputs.docs_only == 'true') }}
        with:
          # actions/setup-node の node-version-file は .nvmrc / .node-version /
          # package.json / .tool-versions(asdf形式) のみ対応で、mise.toml の
          # TOML 形式は解釈できない（1行目 "[tools]" をバージョン文字列として
          # 誤読し失敗する）。mise.toml のバージョンと手動で同期させる。
          node-version: '22.23.4'
          cache: 'pnpm'

      - name: Install dependencies
        if: ${{ !(matrix.check-type == 'e2e' && needs.changes.outputs.docs_only == 'true') }}
        run: pnpm install --frozen-lockfile

      - name: Install system dependencies for PDF rasterization
        if: matrix.check-type == 'test'
        # ghostscript / imagemagick: print-quality-raster.node.test.tsx が PDF ページを
        # ビットマップへ変換し、pdfjs のテキスト層に映らない図形（文字を伴わないチップの
        # 断片等）を検出するために使う（poppler-utils の pdftoppm は使わない設計）。
        run: sudo apt-get update && sudo apt-get install -y poppler-utils ghostscript imagemagick

      - name: Shared CI entry contracts
        if: matrix.check-type == 'lint'
        run: python3 .github/ci/test_entry.py

      - name: Lint
        if: matrix.check-type == 'lint'
        run: bash .github/ci/run.sh lint

      - name: Typecheck
        if: matrix.check-type == 'typecheck'
        run: bash .github/ci/run.sh typecheck

      - name: Test
        if: matrix.check-type == 'test'
        run: bash .github/ci/run.sh test

      # 履歴の容量計測など、使い捨てのローカル PostgreSQL で動く DB 試験。共有 DB・secrets は使わない。
      - name: History DB checks (isolated local PostgreSQL)
        if: matrix.check-type == 'test'
        run: |
          if ! ls /usr/lib/postgresql/*/bin/initdb > /dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql
          fi
          # verify-document-db.sh はログの検査に rg を使う。runner に無い時だけ入れる。
          if ! command -v rg > /dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
          fi
          bash .github/ci/run.sh history-db

      - name: Build
        if: matrix.check-type == 'build'
        run: bash .github/ci/run.sh build

      # e2e は実行ごとに自分専用の使い捨て DB を持つ（正本の共有 DB には接続しない #346）。
      # 以前は共有 DB を実行冒頭で drop + create していたため、別の実行と同時に走ると互いの DB を消し合い、
      # 全 run を 1 本ずつに直列化していた。待機枠は 1 つだけで、新しい実行が来ると古い待機は cancel され、
      # 緑の PR が何度も押し出された。実行ごとに DB を持てば、直列化そのものが要らない。
      # 立ち上げ（DB・橋渡し・migrate・文書境界・owner）は script/e2e-isolated-db.sh に集約してあり、
      # 手元でも同じ手順を `pnpm test:e2e:local` で再現できる。
      - name: Start isolated E2E database
        if: matrix.check-type == 'e2e' && needs.changes.outputs.docs_only != 'true'
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          # 捨て用アカウントの平文既定値。公開リポジトリに置く値なので使い捨て DB 上の一時ユーザーにだけ使う（#348）。
          # secret 側に E2E_PASSWORD を置けばそちらが優先される。
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD || 'E2e-test-pass-99' }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          VIEWER_CODE: ${{ secrets.VIEWER_CODE }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          # fork の PR には secrets が渡らない。空のまま進むと認証で全部が赤くなり原因が分かりにくいので、先に止める。
          for name in SESSION_SECRET VIEWER_CODE REVALIDATE_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::secrets.$name が空（fork の PR では secrets が渡らない）。e2e は secrets のある実行でだけ動かせる。"
              exit 1
            fi
          done
          # ubuntu-latest には PostgreSQL のサーバーが入っている。外れた時だけ入れる。
          if ! ls /usr/lib/postgresql/*/bin/initdb > /dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql
          fi
          ./script/e2e-isolated-db.sh up "$RUNNER_TEMP/e2e-db"
          # DATABASE_URL・橋渡しの宛先・owner の id・e2e ユーザーを後続の step へ渡す。
          cat "$RUNNER_TEMP/e2e-db/env" >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        if: matrix.check-type == 'e2e' && needs.changes.outputs.docs_only != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install PDF utilities for E2E
        if: matrix.check-type == 'e2e' && needs.changes.outputs.docs_only != 'true'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Playwright E2E
        if: matrix.check-type == 'e2e' && needs.changes.outputs.docs_only != 'true'
        env:
          BETTER_AUTH_URL: http://127.0.0.1:3210
          # DATABASE_URL・BETTER_AUTH_SECRET・SKILLSHEET_OWNER_ID は Start isolated E2E database が
          # GITHUB_ENV へ渡した値を使う（owner の作成に使った値と食い違わせないため、ここでは上書きしない）。
          # NODE_OPTIONS は全ての node プロセスに効くので、DB に入るこの step だけに付ける。
          NODE_OPTIONS: --import ${{ github.workspace }}/script/isolated-neon-preload.mjs
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          VIEWER_CODE: ${{ secrets.VIEWER_CODE }}
          # secrets.* へ置く（vars.* は秘密管理の対象外で、マスクも権限分離も効かない #348）
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        # playwright は起動時に test-results/ 全体を消去する。headless-e2e の証跡
        # （test-results/e2e）が先に書かれていると消されるため、playwright を先に流す。
        run: bash .github/ci/run.sh playwright

      # Playwright が失敗しても headless E2E まで止めない（証跡 artifact を残すため）。
      - name: Headless browser E2E
        if: matrix.check-type == 'e2e' && needs.changes.outputs.docs_only != 'true' && always()
        env:
          BETTER_AUTH_URL: http://127.0.0.1:3210
          NODE_OPTIONS: --import ${{ github.workspace }}/script/isolated-neon-preload.mjs
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          VIEWER_CODE: ${{ secrets.VIEWER_CODE }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: bash .github/ci/run.sh headless

      - name: Upload E2E evidence
        if: matrix.check-type == 'e2e' && needs.changes.outputs.docs_only != 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: headless-e2e-evidence
          path: |
            test-results/
          if-no-files-found: error
          retention-days: 14

      # DB の作業ディレクトリ（ソケットと橋渡し）を片付ける。runner は使い捨てだが、手元と同じ手順で閉じる。
      - name: Stop isolated E2E database
        if: matrix.check-type == 'e2e' && needs.changes.outputs.docs_only != 'true' && always()
        run: ./script/e2e-isolated-db.sh down "$RUNNER_TEMP/e2e-db"
