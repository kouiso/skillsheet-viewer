name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 命名規約（英語・小文字・単数形・ケバブケース）。人が書いても AI が書いても
  # PR 時点で必ずここを通る。node のセットアップ不要なので独立ジョブにして即座に落とす。
  naming:
    name: Naming convention
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      # 供給網対策でタグではなく commit へ固定する（タグは上流で付け替えられる）。v4 の実体。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check file and directory naming
        run: ./scripts/check-naming.sh

  node:
    name: Node (${{ matrix.check-type }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        check-type: [lint, typecheck, test, build, e2e]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # actions/setup-node の node-version-file は .nvmrc / .node-version /
          # package.json / .tool-versions(asdf形式) のみ対応で、mise.toml の
          # TOML 形式は解釈できない（1行目 "[tools]" をバージョン文字列として
          # 誤読し失敗する）。mise.toml のバージョンと手動で同期させる。
          node-version: '22.21.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: matrix.check-type == 'lint'
        run: pnpm run lint

      - name: Typecheck
        if: matrix.check-type == 'typecheck'
        run: pnpm run type-check

      - name: Test
        if: matrix.check-type == 'test'
        run: pnpm run test

      - name: Build
        if: matrix.check-type == 'build'
        run: pnpm run build

      - name: Headless browser E2E
        if: matrix.check-type == 'e2e'
        run: |
          pnpm run test:e2e
          pnpm run test:e2e:playwright

      - name: Upload E2E evidence
        if: matrix.check-type == 'e2e' && always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-e2e-evidence
          path: |
            test-results/e2e/
            apps/web/test-results/playwright/
          if-no-files-found: error
          retention-days: 14
