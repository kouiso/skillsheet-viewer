name: Semgrep

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.mjs"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Code Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep@sha256:2b33f46ba66cf8cc2ad59ccfa7d22951fd00c632c38f1339e84ec8e6e641a942
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # --baseline で差分ゲートにするため base commit を含む全履歴が要る。
          fetch-depth: 0

      # 依存脆弱性は security-scan.yml の pnpm audit と security-audit.yml の audit-ci が
      # 見ているため、ここは SAST に専念する。
      # --metrics=off は使用状況メトリクスの送信のみを無効化する。ルール自体は
      # p/default 指定時に Semgrep Registry から取得するため通信は残る。
      # --config auto は metrics=off と併用できずエラーになるため、private 化に
      # 備えて明示的なルールパック指定に変更している。
      #
      # --error --baseline: 導入時点で既存コードに 21件の findings（ERROR 1件を含む）
      # があるため全件ゲートにはできない。代わりに「この変更で新たに出た findings
      # のみ fail させる」diff ゲートにし、悪化だけを止める（#348）。
      # 既存 findings のトリアージ（修正 or nosemgrep）が済んだら --baseline を
      # 外して全件ゲートに格上げする。
      - name: Semgrep scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            # workflow_dispatch 等で比較元が取れない場合は findings 報告のみ（fail させない）。
            semgrep scan --config p/default --metrics=off
          else
            # semgrep コンテナの実効ユーザーと checkout 所有者が違うため、
            # safe.directory を通さないと fetch が dubious ownership で落ちる。
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            git fetch --no-tags origin "$BASE_SHA"
            semgrep scan --config p/default --metrics=off --error --baseline "$BASE_SHA"
          fi
