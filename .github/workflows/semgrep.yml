name: Semgrep

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.mjs"
      # ゲート自体の変更でも動作確認できるよう対象に含める。
      - ".github/workflows/semgrep.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Code Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep@sha256:2b33f46ba66cf8cc2ad59ccfa7d22951fd00c632c38f1339e84ec8e6e641a942
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # 依存脆弱性は security-scan.yml の pnpm audit と security-audit.yml の audit-ci が
      # 見ているため、ここは SAST に専念する。
      # --metrics=off は使用状況メトリクスの送信のみを無効化する。ルール自体は
      # p/default 指定時に Semgrep Registry から取得するため通信は残る。
      # --config auto は metrics=off と併用できずエラーになるため、private 化に
      # 備えて明示的なルールパック指定に変更している。
      #
      # 既存 findings のトリアージ（#362）が済んだため全件ゲート。--error で
      # findings が1件でもあれば exit 1 になる。無効化するときは修正を優先し、
      # やむを得ない場合のみ理由コメント付きの nosemgrep を使う。
      - name: Semgrep scan
        run: semgrep scan --config p/default --metrics=off --error
