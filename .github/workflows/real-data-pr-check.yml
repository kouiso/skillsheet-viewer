name: Real Data Check (PR)
on:
  pull_request:
    # edited を入れる: base ブランチの変更（pull_request.base.sha の差し替え）でも比較対象が変わるため再実行する
    types: [opened, reopened, synchronize, ready_for_review, edited]
    paths-ignore: ['**/*.md', 'doc/**']
permissions:
  contents: read
concurrency:
  group: real-data-pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pdf:
    name: PDF (real data)
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    uses: kouiso/skillsheet-viewer/.github/workflows/real-data-check.yml@main
    with:
      name: PDF
      sheet-id: ${{ vars.PDF_CHECK_SHEET_ID }}
      raster-deps: true
      base-ref: ${{ github.event.pull_request.base.sha }}
    secrets:
      database-url: ${{ secrets.PDF_CHECK_DATABASE_URL }}
      owner-id: ${{ secrets.SKILLSHEET_OWNER_ID }}
  xlsx:
    name: XLSX (real data)
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    uses: kouiso/skillsheet-viewer/.github/workflows/real-data-check.yml@main
    with:
      name: XLSX
      sheet-id: ${{ vars.XLSX_CHECK_SHEET_ID }}
      test-paths: src/lib/export/xlsx-format-check.node.test.tsx
      base-ref: ${{ github.event.pull_request.base.sha }}
    secrets:
      database-url: ${{ secrets.XLSX_CHECK_DATABASE_URL }}
      owner-id: ${{ secrets.SKILLSHEET_OWNER_ID }}
