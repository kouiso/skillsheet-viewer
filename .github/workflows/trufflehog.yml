name: TruffleHog Secret Scan

on:
  pull_request:
    # ready_for_review を入れるのは、draft の間は走らせず、draft を外した時に走らせるため。
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # main への push は連続しても先のスキャンを捨てない（後続は範囲が足りるとは限らない）
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trufflehog:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # draft の PR では走らせない（push は対象外なので常に走る）。
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@702bbefa350895c57f0e303eeb2855a1c637908f # v3.92.2
        with:
          extra_args: --only-verified
