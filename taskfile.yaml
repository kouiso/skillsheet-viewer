# https://taskfile.dev

version: '3'

dotenv:
  - .env

tasks:
  default:
    cmds:
      - task -l

  init:
    desc: "初期セットアップ"
    cmds:
      - pnpm install
      - cp -n .env.example .env || true
      - echo "✅ Setup complete"

  up:
    desc: "開発サーバー起動"
    cmds:
      - pnpm dev

  naming:
    desc: "ファイル名・ディレクトリ名の規約チェック（英語・小文字・単数形・ケバブケース）"
    cmds:
      - ./script/check-naming.sh

  healthcheck:
    desc: "動作確認（命名規約・型チェック・テスト・ビルド）"
    cmds:
      - task: ci:fast

  ci:fast:
    desc: "クラウドと同じ命名・lint・型・全単体テスト・ビルド"
    cmds:
      - python3 .github/ci/test_entry.py
      - bash .github/ci/run.sh fast

  ci:
    desc: "共通CIと既存の隔離DBを使うPlaywright・headless E2E"
    cmds:
      - python3 .github/ci/test_entry.py
      - bash .github/ci/run.sh full
