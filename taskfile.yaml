# https://taskfile.dev

version: '3'

dotenv:
  - .env

tasks:
  default:
    cmds:
      - task -l

  init:
    desc: "初期セットアップ"
    cmds:
      - pnpm install
      - cp -n .env.example .env || true
      - echo "✅ Setup complete"

  up:
    desc: "開発サーバー起動"
    cmds:
      - pnpm dev

  naming:
    desc: "ファイル名・ディレクトリ名の規約チェック（英語・小文字・単数形・ケバブケース）"
    cmds:
      - ./scripts/check-naming.sh

  healthcheck:
    desc: "動作確認（命名規約・型チェック・テスト・ビルド）"
    cmds:
      - ./scripts/check-naming.sh
      - pnpm type-check
      - pnpm test
      - pnpm build
      - echo "✅ Health check passed"
